<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azeem Mart - Admin Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; }
  .top-bar { background: #1b5e20; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  .top-bar h1 { font-size: 20px; }
  .top-bar button { background: #fff; color: #1b5e20; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 10px 18px; background: #fff; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .tab.active { background: #1b5e20; color: #fff; border-color: #1b5e20; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
  .card h2 { margin-bottom: 12px; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
  th { background: #f0f0f0; font-weight: 600; }
  .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #1b5e20; color: #fff; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-secondary { background: #eee; color: #333; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-row input, .form-row select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; flex: 1; min-width: 140px; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; display: none; }
  .msg.error { background: #ffebee; color: #c62828; display: block; }
  .msg.success { background: #e8f5e9; color: #1b5e20; display: block; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 20px; width: 90%; max-width: 480px; }
  .modal h3 { margin-bottom: 12px; }
  .modal .form-group { margin-bottom: 10px; }
  .modal .form-group label { display: block; font-size: 13px; margin-bottom: 4px; }
  .modal .form-group input, .modal .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .empty { text-align: center; padding: 24px; color: #777; }
  #loading { text-align: center; padding: 40px; color: #777; }
</style>
</head>
<body>
<div class="top-bar">
  <h1>🛡️ Azeem Mart — Admin Dashboard</h1>
  <div>
    <span id="adminName" style="margin-right:12px;"></span>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div id="msg" class="msg"></div>
  <div id="loading">Verifying admin access...</div>

  <div id="dashboard" style="display:none;">
    <div class="tabs">
      <div class="tab active" onclick="showTab('users', this)">Users</div>
      <div class="tab" onclick="showTab('products', this)">Products</div>
    </div>

    <!-- Users panel -->
    <div id="users" class="panel active">
      <div class="card">
        <h2>Add User</h2>
        <div class="form-row">
          <input id="nu_username" placeholder="Username">
          <input id="nu_email" placeholder="Email">
          <input id="nu_password" type="password" placeholder="Password">
          <select id="nu_role">
            <option value="customer">customer</option>
            <option value="seller">seller</option>
            <option value="admin">admin</option>
          </select>
          <button class="btn btn-primary" onclick="addUser()">Add</button>
        </div>
      </div>
      <div class="card">
        <h2>All Users</h2>
        <table>
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
        <div id="usersEmpty" class="empty" style="display:none;">No users found.</div>
      </div>
    </div>

    <!-- Products panel -->
    <div id="products" class="panel">
      <div class="card">
        <h2>Add Product</h2>
        <div class="form-row">
          <input id="np_name" placeholder="Name">
          <input id="np_price" type="number" step="0.01" placeholder="Price">
          <input id="np_stock" type="number" placeholder="Stock">
          <input id="np_description" placeholder="Description">
          <button class="btn btn-primary" onclick="addProduct()">Add</button>
        </div>
      </div>
      <div class="card">
        <h2>All Products</h2>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr></thead>
          <tbody id="productsBody"></tbody>
        </table>
        <div id="productsEmpty" class="empty" style="display:none;">No products found.</div>
      </div>
    </div>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editUserModal">
  <div class="modal">
    <h3>Edit User</h3>
    <input type="hidden" id="eu_id">
    <div class="form-group"><label>Username</label><input id="eu_username"></div>
    <div class="form-group"><label>Email</label><input id="eu_email"></div>
    <div class="form-group"><label>Role</label>
      <select id="eu_role">
        <option value="customer">customer</option>
        <option value="seller">seller</option>
        <option value="admin">admin</option>
      </select>
    </div>
    <div class="form-group"><label>New Password (leave blank to keep)</label><input id="eu_password" type="password"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editUserModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Product Modal -->
<div class="modal-overlay" id="editProductModal">
  <div class="modal">
    <h3>Edit Product</h3>
    <input type="hidden" id="ep_id">
    <div class="form-group"><label>Name</label><input id="ep_name"></div>
    <div class="form-group"><label>Price</label><input id="ep_price" type="number" step="0.01"></div>
    <div class="form-group"><label>Stock</label><input id="ep_stock" type="number"></div>
    <div class="form-group"><label>Description</label><input id="ep_description"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editProductModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://azeem-mart-capstone.vercel.app';
let token = localStorage.getItem('azeem_token');
let currentUser = JSON.parse(localStorage.getItem('azeem_user') || 'null');

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  setTimeout(() => { m.className = 'msg'; }, 3000);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function logout() {
  if (token) fetch(API_BASE + '/api/v1/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(()=>{});
  localStorage.removeItem('azeem_token');
  localStorage.removeItem('azeem_user');
  localStorage.removeItem('azeem_cart');
  window.location.href = 'index.html';
}

function showTab(name, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  el.classList.add('active');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ---- Users ----
async function loadUsers() {
  try {
    const users = await api('/api/v1/admin/users');
    const body = document.getElementById('usersBody');
    body.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${escapeHtml(u.username || '')}</td>
        <td>${escapeHtml(u.email || '')}</td>
        <td>${escapeHtml(u.role || '')}</td>
        <td>${escapeHtml(u.created_at || '')}</td>
        <td>
          <button class="btn btn-secondary" onclick="editUser('${u.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteUser('${u.id}')">Delete</button>
        </td>
      </tr>`).join('');
    document.getElementById('usersEmpty').style.display = users.length ? 'none' : 'block';
  } catch (e) { showMsg(e.message, 'error'); }
}

async function addUser() {
  try {
    const username = document.getElementById('nu_username').value.trim();
    const email = document.getElementById('nu_email').value.trim();
    const password = document.getElementById('nu_password').value;
    const role = document.getElementById('nu_role').value;
    if (!username || !email || !password) { showMsg('All fields required', 'error'); return; }
    await api('/api/v1/admin/users', { method: 'POST', body: JSON.stringify({ username, email, password, role }) });
    showMsg('User added', 'success');
    document.getElementById('nu_username').value = '';
    document.getElementById('nu_email').value = '';
    document.getElementById('nu_password').value = '';
    loadUsers();
  } catch (e) { showMsg(e.message, 'error'); }
}

async function editUser(id) {
  try {
    const u = await api('/api/v1/admin/users/' + encodeURIComponent(id));
    document.getElementById('eu_id').value = u.id;
    document.getElementById('eu_username').value = u.username || '';
    document.getElementById('eu_email').value = u.email || '';
    document.getElementById('eu_role').value = u.role || 'customer';
    document.getElementById('eu_password').value = '';
    document.getElementById('editUserModal').classList.add('show');
  } catch (e) { showMsg(e.message, 'error'); }
}

async function saveUser() {
  try {
    const id = document.getElementById('eu_id').value;
    const body = {
      username: document.getElementById('eu_username').value.trim(),
      email: document.getElementById('eu_email').value.trim(),
      role: document.getElementById('eu_role').value,
    };
    const pw = document.getElementById('eu_password').value;
    if (pw) body.password = pw;
    await api('/api/v1/admin/users/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(body) });
    showMsg('User updated', 'success');
    closeModal('editUserModal');
    loadUsers();
  } catch (e) { showMsg(e.message, 'error'); }
}

async function deleteUser(id) {
  if (!confirm('Delete this user?')) return;
  try {
    await api('/api/v1/admin/users/' + encodeURIComponent(id), { method: 'DELETE' });
    showMsg('User deleted', 'success');
    loadUsers();
  } catch (e) { showMsg(e.message, 'error'); }
}

// ---- Products ----
async function loadProducts() {
  try {
    const products = await api('/api/v1/products');
    const body = document.getElementById('productsBody');
    body.innerHTML = products.map(p => `
      <tr>
        <td>${p.id}</td>
        <td>${escapeHtml(p.name || '')}</td>
        <td>${Number(p.price || 0).toFixed(2)}</td>
        <td>${p.stock ?? 0}</td>
        <td>${escapeHtml(p.description || '')}</td>
        <td>
          <button class="btn btn-secondary" onclick="editProduct('${p.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </td>
      </tr>`).join('');
    document.getElementById('productsEmpty').style.display = products.length ? 'none' : 'block';
  } catch (e) { showMsg(e.message, 'error'); }
}

async function addProduct() {
  try {
    const name = document.getElementById('np_name').value.trim();
    const price = document.getElementById('np_price').value;
    const stock = document.getElementById('np_stock').value;
    const description = document.getElementById('np_description').value.trim();
    if (!name || price === '') { showMsg('Name and price required', 'error'); return; }
    await api('/api/v1/products', { method: 'POST', body: JSON.stringify({ name, price: Number(price), stock: Number(stock || 0), description }) });
    showMsg('Product added', 'success');
    document.getElementById('np_name').value = '';
    document.getElementById('np_price').value = '';
    document.getElementById('np_stock').value = '';
    document.getElementById('np_description').value = '';
    loadProducts();
  } catch (e) { showMsg(e.message, 'error'); }
}

async function editProduct(id) {
  try {
    const p = await api('/api/v1/products/' + encodeURIComponent(id));
    document.getElementById('ep_id').value = p.id;
    document.getElementById('ep_name').value = p.name || '';
    document.getElementById('ep_price').value = p.price ?? '';
    document.getElementById('ep_stock').value = p.stock ?? '';
    document.getElementById('ep_description').value = p.description || '';
    document.getElementById('editProductModal').classList.add('show');
  } catch (e) { showMsg(e.message, 'error'); }
}

async function saveProduct() {
  try {
    const id = document.getElementById('ep_id').value;
    const body = {
      name: document.getElementById('ep_name').value.trim(),
      price: Number(document.getElementById('ep_price').value),
      stock: Number(document.getElementById('ep_stock').value),
      description: document.getElementById('ep_description').value.trim(),
    };
    await api('/api/v1/products/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(body) });
    showMsg('Product updated', 'success');
    closeModal('editProductModal');
    loadProducts();
  } catch (e) { showMsg(e.message, 'error'); }
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  try {
    await api('/api/v1/products/' + encodeURIComponent(id), { method: 'DELETE' });
    showMsg('Product deleted', 'success');
    loadProducts();
  } catch (e) { showMsg(e.message, 'error'); }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- Init ----
(async function init() {
  if (!token) { window.location.href = 'index.html'; return; }
  try {
    const u = await api('/api/v1/auth/validate');
    if ((u.role || '') !== 'admin') { window.location.href = 'index.html'; return; }
    currentUser = u;
    localStorage.setItem('azeem_user', JSON.stringify(u));
    document.getElementById('adminName').textContent = u.username || u.email;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers();
    loadProducts();
  } catch (e) {
    window.location.href = 'index.html';
  }
})();
</script>
</body>
</html>
