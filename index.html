<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azeem Mart - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1b5e20, #43a047); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; padding: 36px 32px; width: 90%; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  h1 { text-align: center; color: #1b5e20; margin-bottom: 4px; font-size: 26px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 24px; }
  .tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
  .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: #f5f5f5; font-weight: 600; }
  .tab.active { background: #1b5e20; color: #fff; }
  .form { display: none; }
  .form.active { display: block; }
  .form-group { margin-bottom: 14px; }
  label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; font-size: 14px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: #1b5e20; }
  button { width: 100%; padding: 12px; background: #1b5e20; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  button:hover { background: #15521a; }
  .msg { padding: 10px 12px; border-radius: 6px; margin-top: 14px; display: none; font-size: 14px; }
  .msg.success { background: #e8f5e9; color: #1b5e20; display: block; }
  .msg.error { background: #ffebee; color: #c62828; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Azeem Mart</h1>
  <p class="subtitle">Fresh groceries & quality electronics</p>

  <div class="tabs">
    <div class="tab active" onclick="showForm('login')">Login</div>
    <div class="tab" onclick="showForm('register')">Register</div>
  </div>

  <div id="loginForm" class="form active">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>
    <button onclick="login()">Login</button>
  </div>

  <div id="registerForm" class="form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="regUsername" placeholder="Choose a username">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="Enter your email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Choose a password">
    </div>
    <button onclick="register()">Register</button>
  </div>

  <div id="msg" class="msg"></div>
</div>

<script>
const API_BASE = 'https://azeem-mart-capstone.vercel.app';

function showForm(type) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
  if (type === 'login') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  hideMsg();
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

function hideMsg() { document.getElementById('msg').className = 'msg'; }

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showMsg('Please fill in all fields', 'error'); return; }
  try {
    const res = await fetch(API_BASE + '/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('azeem_token', data.token);
      localStorage.setItem('azeem_user', JSON.stringify(data.user));
      window.location.href = 'shop.html';
    } else {
      showMsg(data.error || 'Login failed', 'error');
    }
  } catch (e) {
    showMsg('Cannot connect to server', 'error');
  }
}

async function register() {
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!username || !email || !password) { showMsg('Please fill in all fields', 'error'); return; }
  try {
    const res = await fetch(API_BASE + '/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('Registration successful! Please login.', 'success');
      showForm('login');
    } else {
      showMsg(data.error || 'Registration failed', 'error');
    }
  } catch (e) {
    showMsg('Cannot connect to server', 'error');
  }
}

document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
document.getElementById('regPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') register(); });
</script>
</body>
</html>
