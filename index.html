<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeem Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #ddd; background: #f5f5f5; }
        .tab:first-child { border-radius: 5px 0 0 5px; }
        .tab:last-child { border-radius: 0 5px 5px 0; }
        .tab.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        input:focus { outline: none; border-color: #4CAF50; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #45a049; }
        .message { padding: 10px; margin-top: 15px; border-radius: 5px; display: none; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .form { display: none; }
        .form.active { display: block; }
        .token-box { background: #f5f5f5; padding: 10px; border-radius: 5px; margin-top: 15px; word-break: break-all; font-family: monospace; font-size: 12px; display: none; }
        .home { display: none; }
        .home.active { display: block; }
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .navbar h2 { margin: 0; }
        .logout-btn { width: auto; background: #dc3545; }
        .logout-btn:hover { background: #c82333; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .product-card h3 { margin: 0 0 10px 0; color: #333; }
        .product-card p { color: #666; margin: 0 0 10px 0; font-size: 14px; }
        .product-card .price { font-weight: bold; color: #4CAF50; font-size: 16px; margin-bottom: 10px; display: block; }
        .product-card .stock { color: #666; font-size: 12px; }
        .empty-state { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Firebase status -->
        <div id="firebaseStatus" style="margin-bottom:20px;font-size:12px;color:#666;text-align:center;">Firebase: initializing…</div>

        <!-- Login / Register Forms -->
        <div id="authContainer">
            <h1>Azeem Mart</h1>
            <p class="subtitle">E-Commerce API Authentication</p>

            <div class="tabs">
                <div class="tab active" onclick="showForm('login')">Login</div>
                <div class="tab" onclick="showForm('register')">Register</div>
            </div>

            <div id="loginForm" class="form active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
            </div>

            <div id="registerForm" class="form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Choose a password">
                </div>
                <button onclick="register()">Register</button>
            </div>

            <div id="message" class="message"></div>
        </div>

        <!-- Home Page (shown after login) -->
        <div id="homeContainer" class="home">
            <div class="navbar">
                <h2>Azeem Mart</h2>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <h2 id="welcomeText">Welcome, <span id="userName"></span></h2>
            <p class="subtitle">Browse our products</p>
            <div id="productsGrid" class="products-grid">
                <div class="empty-state">Loading products…</div>
            </div>
        </div>
    </div>

    <!-- Firebase Web SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQcfmasl2NxyR0TwaGbyYRSRP83uhtm9c",
            authDomain: "azeem-mart.firebaseapp.com",
            projectId: "azeem-mart",
            storageBucket: "azeem-mart.firebasestorage.app",
            messagingSenderId: "490643007403",
            appId: "1:490643007403:web:c3d415e8af6b0cd3ba14ee",
            measurementId: "G-ELYKJVQ3CC"
        };

        try {
            const app = initializeApp(firebaseConfig);
            try { getAnalytics(app); } catch (e) { /* ignore */ }
            window.firebaseApp = app;
            window.firebaseAuth = getAuth(app);
            window.firebaseDb = getFirestore(app);
            document.getElementById('firebaseStatus').textContent = 'Firebase connected: ' + firebaseConfig.projectId + ' (Auth + Firestore ready)';
        } catch (e) {
            document.getElementById('firebaseStatus').textContent = 'Firebase init failed: ' + e.message;
        }
    </script>

    <script>
        const API_BASE = '';

        // ---------- Auth state ----------
        function isLoggedIn() {
            return !!localStorage.getItem('token');
        }

        function getUser() {
            try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; }
        }

        function showAuth() {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('homeContainer').style.display = 'none';
        }

        function showHome() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('homeContainer').style.display = 'block';
            const user = getUser();
            document.getElementById('userName').textContent = user ? (user.username || user.email) : 'Customer';
            loadProducts();
        }

        function showForm(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            if (type === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            hideMessage();
        }

        // ---------- Messages ----------
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // ---------- Login ----------
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            try {
                const response = await fetch(API_BASE + '/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('Login successful! Welcome ' + (data.user.username || data.user.email), 'success');
                    setTimeout(() => showHome(), 800);
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Cannot connect to server. Is it running?', 'error');
            }
        }

        // ---------- Register ----------
        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            if (!username || !email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            try {
                const response = await fetch(API_BASE + '/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    showMessage('Registration successful! Please login.', 'success');
                    showForm('login');
                } else {
                    showMessage(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage('Cannot connect to server. Is it running?', 'error');
            }
        }

        // ---------- Logout ----------
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            showAuth();
        }

        // ---------- Products ----------
        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const response = await fetch(API_BASE + '/api/v1/products', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const products = await response.json();
                if (!response.ok) {
                    grid.innerHTML = '<div class="empty-state">Failed to load products: ' + (products.error || 'unknown error') + '</div>';
                    return;
                }
                if (!products || products.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No products available.</div>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <h3>${escapeHtml(p.name)}</h3>
                        <p>${escapeHtml(p.description || '')}</p>
                        <span class="price">₹${Number(p.price).toFixed(2)}</span>
                        <p class="stock">Stock: ${p.stock}</p>
                        <p class="stock">Category: ${p.category || 'general'}</p>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = '<div class="empty-state">Error loading products.</div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- Enter key ----------
        document.getElementById('loginPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
        document.getElementById('regPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') register(); });

        // ---------- Init ----------
        if (isLoggedIn()) {
            showHome();
        } else {
            showAuth();
        }
    </script>
</body>
</html>
